<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Encarte Associadas</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="login-card">
    <div class="logo-wrap">
      <img class="logo" src="logo.png" alt="Farmácias Associadas" />
    </div>
    <h1>Acesso restrito</h1>
    <p class="subtitle">Informe a senha para acessar o gerador.</p>
    <form id="loginForm" autocomplete="off">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autofocus />
      <div id="error" class="error hidden"></div>
      <button id="submit" type="submit">Entrar</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
